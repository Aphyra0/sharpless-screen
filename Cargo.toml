[package]
name = "wlr-screen-corners"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Draw black rounded corners at the edges of the screen on Wayland"
license = "MIT"

[dependencies]
smithay-client-toolkit = { version = "0.21.1", default-features = false }
wayland-client = "0.31"
log = "0.4"
env_logger = "0.11"
tiny-skia = "0.12"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
